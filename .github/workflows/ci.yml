name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      UV_VERSION: "0.12.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: lock files are fresh (after editing requirements*.txt, including Dependabot PRs, run scripts/relock.sh)
        run: |
          pip install "uv==${UV_VERSION}"
          scripts/relock.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock
      - run: ruff check .
      - run: mypy
      - run: pytest -q --cov --cov-report=term-missing --cov-fail-under=80
      - run: pip-audit -r requirements.lock --progress-spinner off
